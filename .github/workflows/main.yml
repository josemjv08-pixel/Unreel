/** Snapshot passed down the tree; a new instance on every change forces recomposition. */
class Store(val prefs: Prefs, val version: Int, private val bump: () -> Unit) {
    fun update(block: Prefs.() -> Unit) {
        prefs.block(); bump()
    }
}

class MainActivity : ComponentActivity() {
    private val resumeCount = mutableIntStateOf(0)

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        enableEdgeToEdge()
        val prefs = Prefs(this)
        setContent {
            var version by remember { mutableIntStateOf(0) }
            LaunchedEffect(Unit) {
                while (true) { delay(5000); version++ }
            }
            val v = version + resumeCount.intValue
            val store = Store(prefs, v) { version++ }
            UnreelTheme(prefs.themeMode, prefs.appAccent, prefs.dynamicColor) {
                Surface(color = MaterialTheme.colorScheme.background, modifier = Modifier.fillMaxSize()) {
                    App(store)
                }
            }
        }
    }

    override fun onResume() {
        super.onResume()
        resumeCount.intValue++
    }
}

@Composable
fun App(store: Store) {
    var route by rememberSaveable { mutableStateOf("home") }
    BackHandler(enabled = route != "home") { route = "home" }
    val back = { route = "home" }
    Crossfade(targetState = route, label = "nav") { r ->
        when (r) {
            "rules" -> RulesScreen(store, back)
            "block" -> BlockScreenScreen(store, back)
            "appearance" -> AppearanceScreen(store, back)
            "advanced" -> AdvancedScreen(store, back)
            else -> HomeScreen(store) { route = it }
        }
    }
}

fun isServiceEnabled(ctx: Context): Boolean {
    val s = Settings.Secure.getString(ctx.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES)
        ?: return false
    val me = ComponentName(ctx, BlockerService::class.java)
    return s.split(':').any { ComponentName.unflattenFromString(it) == me }
}

@Composable
fun HomeScreen(store: Store, go: (String) -> Unit) {
    val p = store.prefs
    val ctx = LocalContext.current
    val serviceOn = isServiceEnabled(ctx)
    var notifGranted by remember {
        mutableStateOf(
            Build.VERSION.SDK_INT < 33 || ContextCompat.checkSelfPermission(
                ctx, Manifest.permission.POST_NOTIFICATIONS
            ) == PackageManager.PERMISSION_GRANTED
        )
    }
    val notifLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) {
        notifGranted = it
    }

    LazyColumn(
        modifier = Modifier.fillMaxSize().statusBarsPadding(),
        contentPadding = PaddingValues(start = 16.dp, end = 16.dp, top = 20.dp, bottom = 40.dp),
        verticalArrangement = Arrangement.spacedBy(14.dp),
    ) {
        item {
            Column(Modifier.padding(horizontal = 8.dp, vertical = 8.dp)) {
                Text("Unreel", style = MaterialTheme.typography.headlineLarge)
                Text(
                    if (!p.enabled) "Paused" else if (p.limitReached()) "Chats only for the rest of today"
                    else "Less scrolling, more living",
                    style = MaterialTheme.typography.bodyLarge,
                    color = MaterialTheme.colorScheme.onSurfaceVariant,
                )
            }
        }

        if (!serviceOn) {
            item {
                SectionCard {
                    Column(Modifier.padding(18.dp)) {
                        Text("Turn on the blocker", style = MaterialTheme.typography.titleLarge)
                        Spacer(Modifier.height(6.dp))
                        Text(
                            "Unreel needs Accessibility access to see when Instagram is showing Reels. " +
                                "Open Accessibility → Unreel blocker → turn it on.",
                            style = MaterialTheme.typography.bodyMedium,
                            color = MaterialTheme.colorScheme.onSurfaceVariant,
                        )
                        Spacer(Modifier.height(14.dp))
                        Button(
                            onClick = {
                                ctx.startActivity(
                                    Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                                        .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                )
                            },
                            modifier = Modifier.fillMaxWidth(),
                        ) { Text("Open Accessibility settings") }
                        Spacer(Modifier.height(10.dp))
                        Text(
                            "Switch greyed out? Android blocks this for sideloaded apps until you allow it: " +
                                "App info → ⋮ (top right) → Allow restricted settings.",
                            style = MaterialTheme.typography.bodySmall,
                            color = MaterialTheme.colorScheme.onSurfaceVariant,
                        )
                        OutlinedButton(
                            onClick = {
                                ctx.startActivity(
                                    Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS,
                                        android.net.Uri.parse("package:${ctx.packageName}"))
                                        .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                )
                            },
                            modifier = Modifier.fillMaxWidth().padding(top = 8.dp),
                        ) { Text("Open App info") }
                    }
                }
            }
        }

        if (!notifGranted && p.warnEnabled && Build.VERSION.SDK_INT >= 33) {
            item {
                SectionCard {
                    Row(Modifier.padding(18.dp), verticalAlignment = Alignment.CenterVertically) {
                        Text(
                            "Allow notifications to get a heads-up before time runs out.",
                            style = MaterialTheme.typography.bodyMedium,
                            modifier = Modifier.weight(1f),
                        )
                        Spacer(Modifier.width(12.dp))
                        Button(onClick = { notifLauncher.launch(Manifest.permission.POST_NOTIFICATIONS) }) {
                            Text("Allow")
                        }
                    }
                }
            }
        }

        item { UsageCard(store) }
        item { WeekCard(store) }

        item {
            SectionCard("Customize") {
                NavRow("Rules", rulesSummary(p)) { go("rules") }
                RowDivider()
                NavRow("Block screen", "Text, emoji, colors and buttons") { go("block") }
                RowDivider()
                NavRow("Appearance", "Theme and accent color") { go("appearance") }
                RowDivider()
                NavRow("Advanced", "Detection keywords for Instagram updates") { go("advanced") }
            }
        }

        item {
            Text(
                if (serviceOn) "Blocker is running" else "Blocker is off",
                style = MaterialTheme.typography.bodySmall,
                color = MaterialTheme.colorScheme.onSurfaceVariant,
                textAlign = TextAlign.Center,
                modifier = Modifier.fillMaxWidth().navigationBarsPadding(),
            )
        }
    }
}

private fun rulesSummary(p: Prefs): String {
    val parts = mutableListOf<String>()
    if (p.blockReels) parts.add("Reels blocked")
    if (p.limitEnabled) parts.add("${p.limitMinutes} min/day")
    if (p.strictMode) parts.add("strict")
    return if (parts.isEmpty()) "Nothing blocked" else parts.joinToString(" · ")
}

@Composable
private fun UsageCard(store: Store) {
    val p = store.prefs
    val used = p.usedSecondsToday()
    val limit = p.limitMinutes * 60
    val frac = if (p.limitEnabled && limit > 0) (used.toFloat() / limit).coerceIn(0f, 1f) else 0f
    val primary = MaterialTheme.colorScheme.primary
    val track = MaterialTheme.colorScheme.surfaceVariant

    SectionCard {
        Row(Modifier.padding(20.dp), verticalAlignment = Alignment.CenterVertically) {
            Box(Modifier.size(120.dp), contentAlignment = Alignment.Center) {
                Canvas(Modifier.fillMaxSize()) {
                    val sw = 12.dp.toPx()
                    val s = Size(size.width - sw, size.height - sw)
                    val o = Offset(sw / 2, sw / 2)
                    drawArc(track, -90f, 360f, false, o, s, style = Stroke(sw, cap = StrokeCap.Round))
                    if (frac > 0f) {
                        drawArc(primary, -90f, 360f * frac, false, o, s, style = Stroke(sw, cap = StrokeCap.Round))
                    }
                }
                Column(horizontalAlignment = Alignment.CenterHorizontally) {
                    Text(Prefs.formatDuration(used), style = MaterialTheme.typography.headlineMedium)
                    Text(
                        if (p.limitEnabled) "of ${p.limitMinutes}m" else "today",
                        style = MaterialTheme.typography.bodySmall,
                        color = MaterialTheme.colorScheme.onSurfaceVariant,
                    )
                }
            }
            Spacer(Modifier.width(20.dp))
            Column {
                Text("Today", style = MaterialTheme.typography.labelLarge,
                    color = MaterialTheme.colorScheme.onSurfaceVariant)
                Text(
                    when {
                        !p.limitEnabled -> "No daily limit"
                        p.limitReached() -> if (p.allowChats) "Limit reached.\nChats only." else "Limit reached."
                        else -> "${Prefs.formatDuration(p.remainingSeconds())} left"
                    },
                    style = MaterialTheme.typography.titleLarge,
                )
                Spacer(Modifier.height(6.dp))
                Text("Resets at ${Prefs.formatHour(p.resetHour)}",
                    style = MaterialTheme.typography.bodyMedium,
                    color = MaterialTheme.colorScheme.onSurfaceVariant)
            }
        }
    }
}

@Composable
private fun WeekCard(store: Store) {
    val p = store.prefs
    val hist = p.history(7)
    val max = maxOf(hist.maxOf { it.second }, if (p.limitEnabled) p.limitMinutes else 1, 1)
    SectionCard("This week") {
        Row(
            Modifier.fillMaxWidth().height(150.dp).padding(horizontal = 18.dp, vertical = 14.dp),
            horizontalArrangement = Arrangement.spacedBy(10.dp),
            verticalAlignment = Alignment.Bottom,
        ) {
            hist.forEachIndexed { i, (date, mins) ->
                val today = i == hist.lastIndex
                val over = p.limitEnabled && mins >= p.limitMinutes
                Column(
                    Modifier.weight(1f).fillMaxHeight(),
                    horizontalAlignment = Alignment.CenterHorizontally,
                    verticalArrangement = Arrangement.Bottom,
                ) {
                    Text(if (mins > 0) "$mins" else "", style = MaterialTheme.typography.labelSmall,
                        color = MaterialTheme.colorScheme.onSurfaceVariant)
                    Spacer(Modifier.height(4.dp))
                    Box(
                        Modifier
                            .fillMaxWidth()
                            .weight(1f, fill = false)
                            .fillMaxHeight((mins.toFloat() / max).coerceIn(0.03f, 1f))
                            .clip(RoundedCornerShape(8.dp))
                            .background(
                                when {
                                    over -> MaterialTheme.colorScheme.error.copy(alpha = 0.8f)
                                    today -> MaterialTheme.colorScheme.primary
                                    else -> MaterialTheme.colorScheme.primary.copy(alpha = 0.35f)
                                }
                            )
                    )
                    Spacer(Modifier.height(6.dp))
                    Text(
                        date.dayOfWeek.name.take(1),
                        style = MaterialTheme.typography.labelMedium,
                        color = if (today) MaterialTheme.colorScheme.onSurface
                        else MaterialTheme.colorScheme.onSurfaceVariant,
                    )
                }
            }
        }
    }
}

