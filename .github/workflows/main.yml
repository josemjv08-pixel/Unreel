        Text(title, style = MaterialTheme.typography.titleMedium)
        Spacer(Modifier.height(12.dp))
        Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
            swatches.take(8).forEach { c ->
                val color = Color(c)
                val isSel = c == selected
                Box(
                    Modifier
                        .weight(1f)
                        .height(34.dp)
                        .clip(CircleShape)
                        .background(color)
                        .border(
                            if (isSel) 2.dp else 1.dp,
                            if (isSel) MaterialTheme.colorScheme.onSurface
                            else MaterialTheme.colorScheme.outlineVariant,
                            CircleShape,
                        )
                        .clickable { onPick(c) },
                    contentAlignment = Alignment.Center,
                ) {
                    if (isSel) Icon(Icons.Filled.Check, null, Modifier.size(16.dp),
                        tint = if (color.luminance() > 0.5f) Color.Black else Color.White)
                }
            }
        }
        Spacer(Modifier.height(10.dp))
        var hex by remember(selected) { mutableStateOf(String.format("%06X", selected and 0xFFFFFF)) }
        OutlinedTextField(
            value = hex,
            onValueChange = { raw ->
                val clean = raw.removePrefix("#").uppercase().filter { it in "0123456789ABCDEF" }.take(6)
                hex = clean
                if (clean.length == 6) onPick((0xFF000000 or clean.toLong(16)).toInt())
            },
            prefix = { Text("#") },
            label = { Text("Custom hex") },
            singleLine = true,
            shape = RoundedCornerShape(14.dp),
            modifier = Modifier.fillMaxWidth(),
        )
    }
}

@Composable
fun ChoiceChips(options: List<String>, selected: Int, onSelect: (Int) -> Unit) {
    Row(
        Modifier
            .padding(horizontal = 14.dp, vertical = 10.dp)
            .fillMaxWidth()
            .clip(RoundedCornerShape(100.dp))
            .background(MaterialTheme.colorScheme.surfaceVariant)
            .padding(4.dp),
    ) {
        options.forEachIndexed { i, label ->
            val sel = i == selected
            Box(
                Modifier
                    .weight(1f)
                    .clip(RoundedCornerShape(100.dp))
                    .background(if (sel) MaterialTheme.colorScheme.primary else Color.Transparent)
                    .clickable { onSelect(i) }
                    .padding(vertical = 10.dp),
                contentAlignment = Alignment.Center,
            ) {
                Text(label, style = MaterialTheme.typography.labelLarge,
                    color = if (sel) MaterialTheme.colorScheme.onPrimary
                    else MaterialTheme.colorScheme.onSurfaceVariant)
            }
        }
    }
}


package com.unreel.app

import android.accessibilityservice.AccessibilityService
import android.app.KeyguardManager
import android.content.Intent
import android.net.Uri
import android.os.Handler
import android.os.Looper
import android.os.PowerManager
import android.os.SystemClock
import android.view.accessibility.AccessibilityEvent
import android.view.accessibility.AccessibilityNodeInfo
import android.view.accessibility.AccessibilityWindowInfo

class BlockerService : AccessibilityService() {

    private lateinit var prefs: Prefs
    private lateinit var overlay: BlockOverlay
    private val handler = Handler(Looper.getMainLooper())

    private var scanPending = false
    private var lastScan = 0L
    private var lastTick = 0L
    private var screen = Screen.OTHER
    private var targetVisible = false
    private var testing = false
    private var lastChatAt = 0L

    private val tick = object : Runnable {
        override fun run() {
            val now = SystemClock.elapsedRealtime()
            val elapsed = if (lastTick == 0L) 0L else now - lastTick
            lastTick = now
            evaluate()
            countUsage(elapsed)
            handler.postDelayed(this, 1000)
        }
    }

    override fun onServiceConnected() {
        super.onServiceConnected()
        prefs = Prefs(this)
        overlay = BlockOverlay(this, prefs, ::openChats) { testing = false }
        Notifier.ensureChannel(this)
        instance = this
        handler.post(tick)
    }

    override fun onAccessibilityEvent(event: AccessibilityEvent?) {
        if (!::prefs.isInitialized || event == null) return
        val pkg = event.packageName?.toString()
        if (pkg == prefs.targetPackage ||
            event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED ||
            event.eventType == AccessibilityEvent.TYPE_WINDOWS_CHANGED
        ) scheduleScan()
    }

    override fun onInterrupt() {}

    override fun onUnbind(intent: Intent?): Boolean {
        cleanup(); return super.onUnbind(intent)
    }

    override fun onDestroy() {
        cleanup(); super.onDestroy()
    }

    private fun cleanup() {
        handler.removeCallbacksAndMessages(null)
        if (::overlay.isInitialized) overlay.hide()
        if (instance === this) instance = null
    }

    // ------------------------------------------------------------------

    private fun scheduleScan() {
        if (scanPending) return
        scanPending = true
        val wait = (250 - (SystemClock.elapsedRealtime() - lastScan)).coerceAtLeast(0)
        handler.postDelayed({
            scanPending = false
            evaluate()
        }, wait)
    }

    /** Looks at the screen and shows / hides the cover. */
    private fun evaluate() {
        lastScan = SystemClock.elapsedRealtime()
        if (testing) return

        val root = if (isUserActive()) findTargetRoot() else null
        if (root == null) {
            targetVisible = false
            screen = Screen.OTHER
            overlay.hide()
            return
        }
        targetVisible = true
        screen = Detector.classify(
            root,
            Detector.parse(prefs.reelKeywords),
            Detector.parse(prefs.chatKeywords),
            Detector.parse(prefs.extraKeywords),
        )

        val reason: BlockReason? = when {
            !prefs.enabled -> null
            screen == Screen.REELS && prefs.blockReels -> BlockReason.REELS
            screen == Screen.EXTRA -> BlockReason.EXTRA
            prefs.limitReached() && !(prefs.allowChats && screen == Screen.CHAT) -> BlockReason.LIMIT
            else -> null
        }
        val now = SystemClock.elapsedRealtime()
        if (screen == Screen.CHAT) lastChatAt = now
        // Instagram briefly redraws while you move around inside chats; wait a
        // moment before covering the screen so chats don't flicker.
        if (reason == BlockReason.LIMIT && !overlay.isShowing && now - lastChatAt < 700) {
            scheduleScan(); return
        }
        if (reason == null) overlay.hide() else overlay.show(reason)
    }

    private fun countUsage(elapsedMs: Long) {
        if (!targetVisible || !prefs.enabled) return
        if (elapsedMs <= 0 || elapsedMs > 5000) return // skip gaps (doze, sleep)
        if (overlay.isShowing) return // time behind a block screen doesn't count
        if (screen == Screen.CHAT && !prefs.countChatTime) return

        prefs.addUsage(((elapsedMs + 500) / 1000).toInt())

        if (prefs.limitEnabled && prefs.warnEnabled && prefs.warnedDay != prefs.currentDayKey()) {
            val left = prefs.remainingSeconds()
            if (left in 1..(prefs.warnMinutes * 60)) {
                prefs.warnedDay = prefs.currentDayKey()
                Notifier.warn(this, (left + 59) / 60)
            }
        }
    }

    private fun isUserActive(): Boolean {
        val pm = getSystemService(PowerManager::class.java)
        val km = getSystemService(KeyguardManager::class.java)
        return pm.isInteractive && !km.isKeyguardLocked
    }

    /** Returns the root node of a visible Instagram app window, or null. */
    private fun findTargetRoot(): AccessibilityNodeInfo? {
        val target = prefs.targetPackage
        val ws = runCatching { windows }.getOrNull().orEmpty()
        for (w in ws) {
            if (w.type != AccessibilityWindowInfo.TYPE_APPLICATION) continue
            val r = w.root ?: continue
            if (r.packageName?.toString() == target) return r
        }
        val active = runCatching { rootInActiveWindow }.getOrNull()
        return if (active?.packageName?.toString() == target) active else null
    }

    private fun openChats() {
        // 1) Tap Instagram's own inbox button for you.
        val root = findTargetRoot()
        if (root != null && Detector.clickFirst(root, Detector.parse(prefs.inboxKeywords))) {
            scheduleScan(); return
        }
        // 2) Fall back to a deep link into the inbox.
        val links = listOf("https://www.instagram.com/direct/inbox/", "instagram://direct-inbox")
        for (link in links) {
            val ok = runCatching {
                startActivity(
                    Intent(Intent.ACTION_VIEW, Uri.parse(link))
                        .setPackage(prefs.targetPackage)
                        .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                )
            }.isSuccess
            if (ok) break
        }
        scheduleScan()
    }

    /** Shows the block screen for a few seconds so you can preview your design. */
    fun showTest() {
        testing = true
        overlay.show(BlockReason.TEST)
        handler.postDelayed({
            if (testing) { testing = false; overlay.hide() }
        }, 8000)
    }

    companion object {
        @Volatile
        var instance: BlockerService? = null
            private set
    }
}

package com.unreel.app

import android.os.Build
import android.view.accessibility.AccessibilityNodeInfo
import java.util.ArrayDeque

enum class Screen { REELS, EXTRA, CHAT, OTHER }

/**
 * Figures out which part of Instagram is on screen by looking at the
 * resource IDs of visible views (e.g. "com.instagram.android:id/clips_viewer_view_pager").
 * Keywords are user-editable in Settings → Advanced, so if Instagram renames
 * things in an update you can fix detection without a new build.
 */
object Detector {

    private const val MAX_NODES = 2500

    fun parse(csv: String): List<String> =
        csv.split(',', '\n', ';').map { it.trim().lowercase() }.filter { it.isNotEmpty() }

    fun classify(
        root: AccessibilityNodeInfo,
        reel: List<String>,
        chat: List<String>,
        extra: List<String>,
    ): Screen {
        var hasReel = false
        var hasChat = false
        var hasExtra = false

        val queue = ArrayDeque<AccessibilityNodeInfo>()
        queue.add(root)
        var seen = 0
        while (queue.isNotEmpty() && seen < MAX_NODES) {
            val node = queue.poll() ?: break
            seen++
            if (node.isVisibleToUser) {
                val id = node.viewIdResourceName?.substringAfter(":id/")?.lowercase()
                if (id != null) {
                    if (!hasReel && reel.any { id.contains(it) }) hasReel = true
                    if (!hasExtra && extra.any { id.contains(it) }) hasExtra = true
                    if (!hasChat && chat.any { id.contains(it) }) hasChat = true
                }
                for (i in 0 until node.childCount) {
                    node.getChild(i)?.let { queue.add(it) }
                }
            }
            if (node !== root) recycle(node)
            if (hasReel) break // Reels win, no need to keep looking
        }
        while (queue.isNotEmpty()) queue.poll()?.let { if (it !== root) recycle(it) }

        return when {
            hasReel -> Screen.REELS
            hasExtra -> Screen.EXTRA
            hasChat -> Screen.CHAT
            else -> Screen.OTHER
        }
    }

    /** Finds a visible node whose ID matches one of [keywords] and clicks it (or its clickable parent). */
    fun clickFirst(root: AccessibilityNodeInfo, keywords: List<String>): Boolean {
        if (keywords.isEmpty()) return false
        val queue = ArrayDeque<AccessibilityNodeInfo>()
        queue.add(root)
        var seen = 0
        while (queue.isNotEmpty() && seen < MAX_NODES) {
            val node = queue.poll() ?: break
            seen++
            val id = node.viewIdResourceName?.substringAfter(":id/")?.lowercase()
            if (id != null && node.isVisibleToUser && keywords.any { id.contains(it) }) {
                var target: AccessibilityNodeInfo? = node
                while (target != null && !target.isClickable) target = target.parent
                if (target != null && target.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return true
            }
            for (i in 0 until node.childCount) node.getChild(i)?.let { queue.add(it) }
        }
        return false
    }

    @Suppress("DEPRECATION")
    private fun recycle(n: AccessibilityNodeInfo) {
        if (Build.VERSION.SDK_INT < 33) runCatching { n.recycle() }
    }
}

package com.unreel.app

import android.content.Context
import android.content.SharedPreferences
import java.time.LocalDate
import java.time.LocalDateTime
import kotlin.properties.ReadWriteProperty
import kotlin.reflect.KProperty

/**
 * Every setting in the app lives here, backed by SharedPreferences so the
 * accessibility service and the UI always see the same values.
 */
class Prefs(context: Context) {

    val sp: SharedPreferences =
        context.applicationContext.getSharedPreferences("unreel", Context.MODE_PRIVATE)

    // ---------- Rules ----------
    var enabled by bool("enabled", true)
    var blockReels by bool("blockReels", true)
    var limitEnabled by bool("limitEnabled", true)
    var limitMinutes by int("limitMinutes", 30)
    var allowChats by bool("allowChats", true)
    var countChatTime by bool("countChatTime", false)
    var resetHour by int("resetHour", 0)
    var strictMode by bool("strictMode", false)
    var strictOffPending by bool("strictOffPending", false)

    // ---------- Warnings ----------
    var warnEnabled by bool("warnEnabled", true)
    var warnMinutes by int("warnMinutes", 5)

    // ---------- Block screen ----------
    var reelTitle by str("reelTitle", DEF_REEL_TITLE)
    var reelMessage by str("reelMessage", DEF_REEL_MSG)
    var reelEmoji by str("reelEmoji", "🌿")
    var limitTitle by str("limitTitle", DEF_LIMIT_TITLE)
    var limitMessage by str("limitMessage", DEF_LIMIT_MSG)
    var limitEmoji by str("limitEmoji", "⏳")
    var overlayBg by int("overlayBg", 0xFF15131F.toInt())
    var overlayAccent by int("overlayAccent", 0xFF8B7CFF.toInt())
    var overlayGradient by bool("overlayGradient", true)
    var overlayShowStats by bool("overlayShowStats", true)
    var overlayShowLeave by bool("overlayShowLeave", true)

    // ---------- App appearance ----------
    var themeMode by int("themeMode", 0) // 0 system, 1 light, 2 dark
    var appAccent by int("appAccent", 0xFF8B7CFF.toInt())
    var dynamicColor by bool("dynamicColor", false)

    // ---------- Advanced detection ----------
    var targetPackage by str("targetPackage", DEF_PACKAGE)
    var reelKeywords by str("reelKeywords", DEF_REEL_KW)
    var chatKeywords by str("chatKeywords", DEF_CHAT_KW)
    var inboxKeywords by str("inboxKeywords", DEF_INBOX_KW)
    var extraKeywords by str("extraKeywords", "")

    // ---------- Usage ----------
    private var dayKey by str("dayKey", "")
    private var usedSeconds by int("usedSeconds", 0)
    var warnedDay by str("warnedDay", "")

    fun currentDayKey(): String =
        LocalDateTime.now().minusHours(resetHour.toLong()).toLocalDate().toString()

    /** Starts a fresh day when the reset time has passed. */
    fun rolloverIfNeeded() {
        val k = currentDayKey()
        if (dayKey != k) {
            sp.edit().putString("dayKey", k).putInt("usedSeconds", 0).apply()
            if (strictOffPending) {
                strictMode = false
                strictOffPending = false
            }
        }
    }

    fun usedSecondsToday(): Int {
        rolloverIfNeeded()
        return usedSeconds
    }

    fun addUsage(seconds: Int) {
        rolloverIfNeeded()
        val v = usedSeconds + seconds
        sp.edit().putInt("usedSeconds", v).putInt("hist_$dayKey", v).apply()
    }

    fun limitReached(): Boolean =
        enabled && limitEnabled && usedSecondsToday() >= limitMinutes * 60

    fun remainingSeconds(): Int = (limitMinutes * 60 - usedSecondsToday()).coerceAtLeast(0)

    /** Minutes used on each of the last [days] days, oldest first. */
    fun history(days: Int = 7): List<Pair<LocalDate, Int>> {
        val today = LocalDate.parse(currentDayKey())
        return (days - 1 downTo 0).map { back ->
            val d = today.minusDays(back.toLong())
            val secs = if (back == 0) usedSecondsToday() else sp.getInt("hist_$d", 0)
            d to secs / 60
        }
    }

    /** Rules may be loosened only when strict mode is off and today's limit isn't hit yet. */
    fun canLoosen(): Boolean = !strictMode && !limitReached()

    fun resetDetectionDefaults() {
        targetPackage = DEF_PACKAGE
        reelKeywords = DEF_REEL_KW
        chatKeywords = DEF_CHAT_KW
        inboxKeywords = DEF_INBOX_KW
        extraKeywords = ""
    }

    fun resetBlockScreenDefaults() {
        reelTitle = DEF_REEL_TITLE; reelMessage = DEF_REEL_MSG; reelEmoji = "🌿"
        limitTitle = DEF_LIMIT_TITLE; limitMessage = DEF_LIMIT_MSG; limitEmoji = "⏳"
        overlayBg = 0xFF15131F.toInt(); overlayAccent = 0xFF8B7CFF.toInt()
        overlayGradient = true; overlayShowStats = true; overlayShowLeave = true
    }

    // ---------- delegates ----------
    private fun bool(key: String, def: Boolean) = object : ReadWriteProperty<Any?, Boolean> {
        override fun getValue(thisRef: Any?, property: KProperty<*>) = sp.getBoolean(key, def)
        override fun setValue(thisRef: Any?, property: KProperty<*>, value: Boolean) =
            sp.edit().putBoolean(key, value).apply()
    }

    private fun int(key: String, def: Int) = object : ReadWriteProperty<Any?, Int> {
        override fun getValue(thisRef: Any?, property: KProperty<*>) = sp.getInt(key, def)
        override fun setValue(thisRef: Any?, property: KProperty<*>, value: Int) =
            sp.edit().putInt(key, value).apply()
    }

    private fun str(key: String, def: String) = object : ReadWriteProperty<Any?, String> {
        override fun getValue(thisRef: Any?, property: KProperty<*>) = sp.getString(key, def) ?: def
        override fun setValue(thisRef: Any?, property: KProperty<*>, value: String) =
            sp.edit().putString(key, value).apply()
    }

    companion object {
        const val DEF_PACKAGE = "com.instagram.android"
        const val DEF_REEL_KW = "clips_viewer, clips_ufi"
        const val DEF_CHAT_KW =
            "direct_thread, row_thread_composer, thread_title, inbox_refreshable_thread_list, direct_inbox, row_inbox"
        const val DEF_INBOX_KW = "action_bar_inbox_button, direct_tab, inbox_button"
        const val DEF_REEL_TITLE = "Reels are off"
        const val DEF_REEL_MSG = "You chose to skip the endless scroll. Go do something you'll remember."
        const val DEF_LIMIT_TITLE = "That's enough for today"
        const val DEF_LIMIT_MSG = "You've reached your Instagram limit. Your chats are still open."

        fun formatHour(h: Int): String {
            val hr = if (h % 12 == 0) 12 else h % 12
            return "$hr:00 ${if (h < 12) "AM" else "PM"}"
        }

        fun formatDuration(seconds: Int): String {
            val m = seconds / 60
            return if (m >= 60) "${m / 60}h ${m % 60}m" else "${m}m"
        }
    }
}

package com.unreel.app

import android.accessibilityservice.AccessibilityService
import android.graphics.Color
import android.graphics.PixelFormat
import android.graphics.Typeface
import android.graphics.drawable.GradientDrawable
import android.os.Build
import android.util.TypedValue
import android.view.Gravity
import android.view.ViewGroup.LayoutParams.MATCH_PARENT
import android.view.ViewGroup.LayoutParams.WRAP_CONTENT
import android.view.WindowManager
import android.widget.FrameLayout
import android.widget.LinearLayout
import android.widget.TextView
import androidx.core.graphics.ColorUtils

enum class BlockReason { REELS, EXTRA, LIMIT, TEST }

/**
 * Full-screen cover drawn by the accessibility service. There is deliberately
 * no "dismiss" button: the only ways out are going back or leaving Instagram
 * (or opening chats when the daily limit is hit and chats are allowed).
 */
class BlockOverlay(
    private val service: AccessibilityService,
    private val prefs: Prefs,
    private val onOpenChats: () -> Unit,
    private val onClosedTest: () -> Unit,
) {
    private val wm = service.getSystemService(WindowManager::class.java)
    private var root: FrameLayout? = null
    private var current: BlockReason? = null
    private var statsView: TextView? = null

    val isShowing get() = root != null
    val reason get() = current

    fun show(reason: BlockReason) {
        if (current == reason && root != null) {
            refreshStats(); return
        }
        hide()
        val view = build(reason)
        val lp = WindowManager.LayoutParams(
            MATCH_PARENT, MATCH_PARENT,
            WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
            PixelFormat.TRANSLUCENT,
        )
        if (Build.VERSION.SDK_INT >= 28) {
            lp.layoutInDisplayCutoutMode =
                WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
        }
        runCatching {
            wm.addView(view, lp)
            root = view
            current = reason
            view.alpha = 0f
            view.animate().alpha(1f).setDuration(180).start()
        }
    }

    fun hide() {
        root?.let { runCatching { wm.removeViewImmediate(it) } }
        root = null
        current = null
        statsView = null
    }

    fun refreshStats() {
        statsView?.text = statsText()
    }

    private fun statsText(): String {
        val used = Prefs.formatDuration(prefs.usedSecondsToday())
        val reset = Prefs.formatHour(prefs.resetHour)
        return if (prefs.limitEnabled) {
            "$used of ${prefs.limitMinutes}m used today  ·  resets $reset"
        } else "$used on Instagram today"
    }

    // ---------------- view building ----------------

    private fun dp(v: Float) =
        TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v, service.resources.displayMetrics)

    private fun build(reason: BlockReason): FrameLayout {
        val bg = prefs.overlayBg
        val accent = prefs.overlayAccent
        val dark = ColorUtils.calculateLuminance(bg) < 0.5
        val fg = if (dark) Color.WHITE else Color.parseColor("#16151C")
        val fgSoft = ColorUtils.setAlphaComponent(fg, 190)
        val onAccent = if (ColorUtils.calculateLuminance(accent) < 0.55) Color.WHITE else Color.BLACK

        val frame = FrameLayout(service).apply {
            isClickable = true // swallow every touch meant for Instagram
            isFocusable = false
            background = if (prefs.overlayGradient) {
                GradientDrawable(
                    GradientDrawable.Orientation.TL_BR,
                    intArrayOf(
                        ColorUtils.blendARGB(bg, accent, 0.28f),
                        bg,
                        ColorUtils.blendARGB(bg, Color.BLACK, 0.35f),
                    )
                )
            } else GradientDrawable().apply { setColor(bg) }
        }

        val col = LinearLayout(service).apply {
            orientation = LinearLayout.VERTICAL
            gravity = Gravity.CENTER_HORIZONTAL
            val p = dp(32f).toInt()
            setPadding(p, p, p, p)
        }

        val (emoji, title, message) = when (reason) {
            BlockReason.REELS -> Triple(prefs.reelEmoji, prefs.reelTitle, prefs.reelMessage)
            BlockReason.EXTRA -> Triple(prefs.reelEmoji, "This section is blocked", prefs.reelMessage)
            BlockReason.LIMIT -> Triple(
                prefs.limitEmoji, prefs.limitTitle,
                if (prefs.allowChats) prefs.limitMessage
                else prefs.limitMessage.replace("Your chats are still open.", "").trim()
            )
            BlockReason.TEST -> Triple(prefs.limitEmoji, prefs.limitTitle, prefs.limitMessage)
        }

        if (emoji.isNotBlank()) {
            col.addView(TextView(service).apply {
                text = emoji
                setTextSize(TypedValue.COMPLEX_UNIT_SP, 64f)
                gravity = Gravity.CENTER
            }, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT).apply {
                bottomMargin = dp(20f).toInt()
            })
        }

        col.addView(TextView(service).apply {
            text = title
            setTextColor(fg)
            setTextSize(TypedValue.COMPLEX_UNIT_SP, 28f)
            typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
            gravity = Gravity.CENTER
            letterSpacing = -0.01f
        })

        col.addView(TextView(service).apply {
            text = message
            setTextColor(fgSoft)
            setTextSize(TypedValue.COMPLEX_UNIT_SP, 16f)
            gravity = Gravity.CENTER
            setLineSpacing(0f, 1.25f)
        }, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply {
            topMargin = dp(12f).toInt()
        })

        if (prefs.overlayShowStats) {
            val chip = TextView(service).apply {
                text = statsText()
                setTextColor(fg)
                setTextSize(TypedValue.COMPLEX_UNIT_SP, 13f)
                gravity = Gravity.CENTER
                val h = dp(14f).toInt(); val v = dp(8f).toInt()
                setPadding(h, v, h, v)
                background = GradientDrawable().apply {
                    cornerRadius = dp(100f)
                    setColor(ColorUtils.setAlphaComponent(fg, 26))
                }
            }
            statsView = chip
            col.addView(chip, LinearLayout.LayoutParams(WRAP_CONTENT, WRAP_CONTENT).apply {
                topMargin = dp(24f).toInt()
            })
        }

        // ---- buttons ----
        val buttons = LinearLayout(service).apply {
            orientation = LinearLayout.VERTICAL
            gravity = Gravity.CENTER_HORIZONTAL
        }

        fun primary(label: String, action: () -> Unit) = TextView(service).apply {
            text = label
            setTextColor(onAccent)
            setTextSize(TypedValue.COMPLEX_UNIT_SP, 16f)
            typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
            gravity = Gravity.CENTER
            val v = dp(16f).toInt()
            setPadding(v, v, v, v)
            background = GradientDrawable().apply { cornerRadius = dp(100f); setColor(accent) }
            setOnClickListener { action() }
        }

        fun secondary(label: String, action: () -> Unit) = TextView(service).apply {
            text = label
            setTextColor(fgSoft)
            setTextSize(TypedValue.COMPLEX_UNIT_SP, 15f)
            gravity = Gravity.CENTER
            val v = dp(14f).toInt()
            setPadding(v, v, v, v)
            setOnClickListener { action() }
        }

        val full = LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT)
        val home = { service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_HOME); Unit }
        val back = { service.performGlobalAction(AccessibilityService.GLOBAL_ACTION_BACK); Unit }

        when (reason) {
            BlockReason.REELS, BlockReason.EXTRA -> {
                buttons.addView(primary("Go back", back), full)
                if (prefs.overlayShowLeave) buttons.addView(secondary("Leave Instagram", home), full)
            }
            BlockReason.LIMIT -> {
                if (prefs.allowChats) {
                    buttons.addView(primary("Open my chats", onOpenChats), full)
                    if (prefs.overlayShowLeave) buttons.addView(secondary("Leave Instagram", home), full)
                } else {
                    buttons.addView(primary("Leave Instagram", home), full)
                }
            }
            BlockReason.TEST -> {
                buttons.addView(primary("Close preview") { hide(); onClosedTest() }, full)
            }
        }

        col.addView(buttons, LinearLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT).apply {
            topMargin = dp(40f).toInt()
        })

        frame.addView(col, FrameLayout.LayoutParams(MATCH_PARENT, WRAP_CONTENT, Gravity.CENTER))
        return frame
    }
}

package com.unreel.app

import android.Manifest
import android.annotation.SuppressLint
import android.app.NotificationChannel
import android.app.NotificationManager
import android.content.Context
import android.content.pm.PackageManager
import android.os.Build
import androidx.core.app.NotificationCompat
import androidx.core.app.NotificationManagerCompat
import androidx.core.content.ContextCompat

object Notifier {
    private const val CHANNEL = "warnings"

    fun ensureChannel(ctx: Context) {
        if (Build.VERSION.SDK_INT >= 26) {
            val nm = ctx.getSystemService(NotificationManager::class.java)
            nm.createNotificationChannel(
                NotificationChannel(CHANNEL, "Time warnings", NotificationManager.IMPORTANCE_HIGH)
            )
        }
    }

    @SuppressLint("MissingPermission")
    fun warn(ctx: Context, minutesLeft: Int) {
        if (Build.VERSION.SDK_INT >= 33 &&
            ContextCompat.checkSelfPermission(ctx, Manifest.permission.POST_NOTIFICATIONS) !=
            PackageManager.PERMISSION_GRANTED
        ) return
        val n = NotificationCompat.Builder(ctx, CHANNEL)
            .setSmallIcon(R.drawable.ic_launcher_foreground)
            .setContentTitle("$minutesLeft min of Instagram left today")
            .setContentText("After that, only your chats stay open.")
            .setPriority(NotificationCompat.PRIORITY_HIGH)
            .setAutoCancel(true)
            .build()
        runCatching { NotificationManagerCompat.from(ctx).notify(1, n) }
    }
}

