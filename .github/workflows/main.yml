// ======================= RULES =======================

@Composable
fun RulesScreen(store: Store, onBack: () -> Unit) {
    val p = store.prefs
    val loose = p.canLoosen()
    val limitHit = p.limitReached()

    SubScreen("Rules", onBack) {
        if (limitHit) item {
            Banner("Today's limit is reached, so rules can only be made stricter until ${Prefs.formatHour(p.resetHour)}.")
        } else if (p.strictMode) item {
            Banner("Strict mode is on: you can make rules stricter anytime, but loosening them isn't allowed.")
        }

        item {
            SectionCard("Blocking") {
                SwitchRow(
                    "Unreel is active", "Master switch for everything below",
                    checked = p.enabled, enabled = loose || !p.enabled,
                ) { v -> if (v || loose) store.update { enabled = v } }
                RowDivider()
                SwitchRow(
                    "Block Reels", "Covers the Reels tab and any Reel you open",
                    checked = p.blockReels, enabled = loose || !p.blockReels,
                ) { v -> if (v || loose) store.update { blockReels = v } }
            }
        }

        item {
            SectionCard("Daily limit") {
                SwitchRow(
                    "Daily time limit", "Lock Instagram after a set time each day",
                    checked = p.limitEnabled, enabled = loose || !p.limitEnabled,
                ) { v -> if (v || loose) store.update { limitEnabled = v } }
                if (p.limitEnabled) {
                    RowDivider()
                    SliderRow(
                        "Limit", "${p.limitMinutes} min",
                        value = p.limitMinutes.toFloat(), range = 5f..240f, steps = 46,
                        subtitle = if (!loose) "Can only be lowered right now" else null,
                    ) { f ->
                        val nv = ((f / 5f).roundToInt() * 5).coerceIn(5, 240)
                        if (loose || nv < p.limitMinutes) store.update { limitMinutes = nv }
                    }
                    RowDivider()
                    SwitchRow(
                        "Keep chats open after limit", "Messages stay usable; everything else is covered",
                        checked = p.allowChats, enabled = loose || p.allowChats,
                    ) { v -> if (!v || loose) store.update { allowChats = v } }
                    RowDivider()
                    SwitchRow(
                        "Count time spent in chats", "Off = only feed, stories, Reels etc. use up your time",
                        checked = p.countChatTime, enabled = loose || !p.countChatTime,
                    ) { v -> if (v || loose) store.update { countChatTime = v } }
                    RowDivider()
                    SliderRow(
                        "Day resets at", Prefs.formatHour(p.resetHour),
                        value = p.resetHour.toFloat(), range = 0f..23f, steps = 22, enabled = loose,
                    ) { f -> if (loose) store.update { resetHour = f.roundToInt() } }
                }
            }
        }

        if (p.limitEnabled) item {
            SectionCard("Heads-up") {
                SwitchRow("Warn me before time's up", "Sends a notification",
                    checked = p.warnEnabled) { v -> store.update { warnEnabled = v } }
                if (p.warnEnabled) {
                    RowDivider()
                    SliderRow(
                        "Warn when", "${p.warnMinutes} min left",
                        value = p.warnMinutes.toFloat(), range = 1f..15f, steps = 13,
                    ) { f -> store.update { warnMinutes = f.roundToInt() } }
                }
            }
        }

        item {
            SectionCard("Commitment") {
                SwitchRow(
                    "Strict mode",
                    when {
                        p.strictOffPending -> "Turns off at the next reset (${Prefs.formatHour(p.resetHour)})"
                        else -> "Rules (and Advanced) can only get stricter. Turning this off takes effect tomorrow."
                    },
                    checked = p.strictMode,
                ) { v ->
                    store.update {
                        if (v) {
                            strictMode = true
                            strictOffPending = false
                        } else if (strictMode) {
                            strictOffPending = true
                        }
                    }
                }
                if (p.strictOffPending) {
                    TextButton(
                        onClick = { store.update { strictOffPending = false } },
                        modifier = Modifier.padding(horizontal = 8.dp),
                    ) { Text("Keep strict mode on") }
                }
            }
        }

        item {
            Text(
                "Note: Android always lets you switch off an accessibility service in system settings. " +
                    "Unreel can't prevent that — strict mode is about removing the easy escape hatches.",
                style = MaterialTheme.typography.bodySmall,
                color = MaterialTheme.colorScheme.onSurfaceVariant,
                modifier = Modifier.padding(horizontal = 8.dp),
            )
        }
    }
}

// ======================= BLOCK SCREEN =======================

@Composable
fun BlockScreenScreen(store: Store, onBack: () -> Unit) {
    val p = store.prefs
    val ctx = LocalContext.current

    SubScreen("Block screen", onBack) {
        item { OverlayPreview(p) }
        item {
            Button(
                onClick = {
                    val s = BlockerService.instance
                    if (s == null) Toast.makeText(ctx, "Turn on the blocker first", Toast.LENGTH_SHORT).show()
                    else s.showTest()
                },
                modifier = Modifier.fillMaxWidth(),
            ) { Text("Preview full screen") }
        }

        item {
            SectionCard("Reels screen") {
                TextRow("Emoji", p.reelEmoji) { v -> store.update { reelEmoji = v.take(8) } }
                TextRow("Title", p.reelTitle) { v -> store.update { reelTitle = v } }
                TextRow("Message", p.reelMessage, singleLine = false) { v -> store.update { reelMessage = v } }
                Spacer(Modifier.height(8.dp))
            }
        }

        item {
            SectionCard("Time's up screen") {
                TextRow("Emoji", p.limitEmoji) { v -> store.update { limitEmoji = v.take(8) } }
                TextRow("Title", p.limitTitle) { v -> store.update { limitTitle = v } }
                TextRow("Message", p.limitMessage, singleLine = false) { v -> store.update { limitMessage = v } }
                Spacer(Modifier.height(8.dp))
            }
        }

        item {
            SectionCard("Look") {
                ColorPicker("Background", p.overlayBg, BackgroundSwatches) { c -> store.update { overlayBg = c } }
                RowDivider()
                ColorPicker("Button color", p.overlayAccent, AccentSwatches) { c -> store.update { overlayAccent = c } }
                RowDivider()
                SwitchRow("Soft gradient", "Blend the button color into the background",
                    checked = p.overlayGradient) { v -> store.update { overlayGradient = v } }
                RowDivider()
                SwitchRow("Show today's usage", "Small pill with time used and reset time",
                    checked = p.overlayShowStats) { v -> store.update { overlayShowStats = v } }
                RowDivider()
                SwitchRow("Show \"Leave Instagram\"", "Secondary button that takes you home",
                    checked = p.overlayShowLeave) { v -> store.update { overlayShowLeave = v } }
            }
        }

        item {
            OutlinedButton(
                onClick = { store.update { resetBlockScreenDefaults() } },
                modifier = Modifier.fillMaxWidth(),
            ) { Text("Reset block screen to defaults") }
        }
    }
}

@Composable
private fun OverlayPreview(p: Prefs) {
    val bg = Color(p.overlayBg)
    val accent = Color(p.overlayAccent)
    val fg = if (bg.luminance() < 0.5f) Color.White else Color(0xFF16151C)
    val onAccent = if (accent.luminance() < 0.55f) Color.White else Color.Black
    val brush = if (p.overlayGradient) Brush.linearGradient(
        listOf(lerp(bg, accent, 0.28f), bg, lerp(bg, Color.Black, 0.35f))
    ) else Brush.linearGradient(listOf(bg, bg))

    Box(
        Modifier
            .fillMaxWidth()
            .height(380.dp)
            .clip(RoundedCornerShape(28.dp))
            .background(brush)
            .padding(24.dp),
        contentAlignment = Alignment.Center,
    ) {
        Column(horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.Center) {
            if (p.reelEmoji.isNotBlank()) Text(p.reelEmoji, fontSize = 44.sp)
            Spacer(Modifier.height(12.dp))
            Text(p.reelTitle, color = fg, fontSize = 22.sp, fontWeight = FontWeight.SemiBold,
                textAlign = TextAlign.Center)
            Spacer(Modifier.height(8.dp))
            Text(p.reelMessage, color = fg.copy(alpha = 0.75f), fontSize = 14.sp,
                textAlign = TextAlign.Center)
            if (p.overlayShowStats) {
                Spacer(Modifier.height(16.dp))
                Text(
                    "${Prefs.formatDuration(p.usedSecondsToday())} used today",
                    color = fg, fontSize = 12.sp,
                    modifier = Modifier
                        .clip(RoundedCornerShape(100.dp))
                        .background(fg.copy(alpha = 0.1f))
                        .padding(horizontal = 12.dp, vertical = 6.dp),
                )
            }
            Spacer(Modifier.height(24.dp))
            Text(
                "Go back", color = onAccent, fontWeight = FontWeight.Medium,
                textAlign = TextAlign.Center,
                modifier = Modifier
                    .fillMaxWidth()
                    .clip(RoundedCornerShape(100.dp))
                    .background(accent)
                    .padding(vertical = 12.dp),
            )
            if (p.overlayShowLeave) {
                Text("Leave Instagram", color = fg.copy(alpha = 0.75f), fontSize = 14.sp,
                    modifier = Modifier.padding(top = 10.dp))
            }
        }
    }
}

// ======================= APPEARANCE =======================

@Composable
fun AppearanceScreen(store: Store, onBack: () -> Unit) {
    val p = store.prefs
    SubScreen("Appearance", onBack) {
        item {
            SectionCard("Theme") {
                ChoiceChips(listOf("System", "Light", "Dark"), p.themeMode) { i ->
                    store.update { themeMode = i }
                }
                if (Build.VERSION.SDK_INT >= 31) {
                    RowDivider()
                    SwitchRow("Use wallpaper colors", "Material You dynamic color",
                        checked = p.dynamicColor) { v -> store.update { dynamicColor = v } }
                }
            }
        }
        if (!p.dynamicColor || Build.VERSION.SDK_INT < 31) item {
            SectionCard("Accent") {
                ColorPicker("App accent", p.appAccent, AccentSwatches) { c -> store.update { appAccent = c } }
            }
        }
    }
}

// ======================= ADVANCED =======================

@Composable
fun AdvancedScreen(store: Store, onBack: () -> Unit) {
    val p = store.prefs
    val loose = p.canLoosen()
    SubScreen("Advanced", onBack) {
        item {
            Text(
                "Unreel recognises Instagram screens by the internal IDs of their views. " +
                    "If an Instagram update breaks detection, adjust these comma-separated keywords. " +
                    "Any view whose ID contains a keyword counts as a match.",
                style = MaterialTheme.typography.bodyMedium,
                color = MaterialTheme.colorScheme.onSurfaceVariant,
                modifier = Modifier.padding(horizontal = 8.dp),
            )
        }
        if (!loose) item { Banner("Locked while strict mode is on or today's limit is reached.") }
        item {
            SectionCard("Detection") {
                TextRow("App package", p.targetPackage, enabled = loose) { v ->
                    store.update { targetPackage = v.trim() }
                }
                TextRow("Reels keywords", p.reelKeywords, enabled = loose, singleLine = false) { v ->
                    store.update { reelKeywords = v }
                }
                TextRow("Chat keywords (allowed after limit)", p.chatKeywords, enabled = loose, singleLine = false) { v ->
                    store.update { chatKeywords = v }
                }
                TextRow("Inbox button keywords (\"Open my chats\")", p.inboxKeywords, enabled = loose, singleLine = false) { v ->
                    store.update { inboxKeywords = v }
                }
                Spacer(Modifier.height(8.dp))
            }
        }
        item {
            SectionCard("Extra blocked screens") {
                Text(
                    "Optional. Keywords here are always blocked, e.g. \"explore\" for the Explore grid.",
                    style = MaterialTheme.typography.bodyMedium,
                    color = MaterialTheme.colorScheme.onSurfaceVariant,
                    modifier = Modifier.padding(horizontal = 18.dp, vertical = 8.dp),
                )
                // Adding blocks is always allowed (stricter); removing needs `loose`.
                TextRow("Keywords", p.extraKeywords, singleLine = false) { v ->
                    if (loose || v.length >= p.extraKeywords.length && v.startsWith(p.extraKeywords)) {
                        store.update { extraKeywords = v }
                    }
                }
                Spacer(Modifier.height(8.dp))
            }
        }
        item {
            OutlinedButton(
                onClick = { store.update { resetDetectionDefaults() } },
                enabled = loose,
                modifier = Modifier.fillMaxWidth(),
            ) { Text("Reset detection to defaults") }
        }
    }
}

