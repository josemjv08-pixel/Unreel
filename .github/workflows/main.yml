# Unreel

Unreel is an Android app that:

- **Blocks Instagram Reels.** A full-screen cover appears whenever the Reels tab or a Reel opens.
- **Locks Instagram once your daily limit is used up.** After that, only your chats (DMs) still work.
- **Has no dismiss button.** You can go back, leave Instagram, or open your chats. Nothing else.
- **Lets you customize everything:** the limit, reset time, warnings and strict mode, plus the block screen's text, emoji, colors and buttons, the app theme and accent color, and the detection keywords.

## Get the APK (no Android Studio needed)

1. Create a free GitHub account and a new **private** repository.
2. Upload the contents of this folder to it. On the repo page, click "uploading an existing file" and drag everything in, including the hidden `.github` folder. You can also use `git push`.
   - If the `.github` folder didn't upload (Finder and Explorer often hide it), click **Add file → Create new file**, name it `.github/workflows/build.yml`, and paste in the contents of that file from this folder.
3. Open the **Actions** tab. The "Build APK" workflow runs on its own and takes about 5 minutes.
4. Open the finished run and download the **Unreel-apk** artifact (a zip containing `app-release.apk`).
5. Copy the APK to your phone and open it to install. Allow "Install unknown apps" for your browser or file manager when Android asks.

**Using Android Studio instead:** open this folder, wait for Gradle sync to finish, plug in your phone and press ▶ Run.

## First-time setup on the phone

1. Open Unreel and tap **Open Accessibility settings**. Go to *Unreel blocker* and turn it on.
   - If the switch is greyed out ("Restricted setting"), go to **Settings → Apps → Unreel → ⋮ (top right) → Allow restricted settings**, then try again. Android requires this for every app installed from outside the Play Store.
2. Allow notifications if you want a warning before your time runs out.
3. Open **Rules** to set your limit. Once everything is how you want it, turn on **Strict mode**.

## How strict it is

- The block screen has no close button.
- Once you've hit today's limit, rules can only get stricter until the reset time.
- With **Strict mode** on, rules and detection settings can only get stricter at any time. If you switch strict mode off, it stays on until the next reset.
- Time spent behind a block screen doesn't count toward your limit. Time in chats only counts if you turn that on.
- Android always lets you turn off an accessibility service or uninstall an app, and no regular app can prevent that.

## If an Instagram update breaks detection

Unreel recognizes Instagram screens by their internal view IDs. Instagram sometimes renames them. If Reels stop being blocked, or chats get blocked:

1. Install a free view-inspector app such as *Developer Assistant*, or run `adb shell uiautomator dump` from a computer.
2. Open the screen in Instagram and note the view IDs (for example `clips_viewer_view_pager`).
3. Put a distinctive part of the ID into **Unreel → Advanced**.

Defaults:

| Purpose | Keywords |
|---|---|
| Reels | `clips_viewer, clips_ufi` |
| Chats (allowed after limit) | `direct_thread, row_thread_composer, thread_title, inbox_refreshable_thread_list, direct_inbox, row_inbox` |
| "Open my chats" button | `action_bar_inbox_button, direct_tab, inbox_button` |

## Project layout

```
app/src/main/java/com/unreel/app/
  BlockerService.kt   accessibility service: detection loop, time tracking, warnings
  Detector.kt         classifies the Instagram screen from view IDs
  BlockOverlay.kt     the full-screen block cover
  Prefs.kt            all settings + daily usage storage
  Notifier.kt         "X min left" notification
  ui/                 Jetpack Compose settings app (home, rules, block screen, appearance, advanced)
```

Privacy: everything stays on your phone. The app has no internet permission.

