val AccentSwatches = listOf(
    0xFF8B7CFF, 0xFF4C8DFF, 0xFF1FB58F, 0xFFFF8A5C,
    0xFFFF5C7A, 0xFFE86FD0, 0xFFF2C14E, 0xFF8E9AAF,
).map { it.toInt() }

val BackgroundSwatches = listOf(
    0xFF15131F, 0xFF0B0B0D, 0xFF1C1B4B, 0xFF0D3B2E,
    0xFF3A0E2E, 0xFF102A43, 0xFF4A2511, 0xFFF4F1EA,
).map { it.toInt() }

@Composable
fun UnreelTheme(themeMode: Int, accent: Int, dynamic: Boolean, content: @Composable () -> Unit) {
    val dark = when (themeMode) {
        1 -> false
        2 -> true
        else -> isSystemInDarkTheme()
    }
    val a = Color(accent)
    val onA = if (a.luminance() > 0.5f) Color.Black else Color.White
    val ctx = LocalContext.current

    val scheme = when {
        dynamic && Build.VERSION.SDK_INT >= 31 ->
            if (dark) dynamicDarkColorScheme(ctx) else dynamicLightColorScheme(ctx)
        dark -> darkColorScheme(
            primary = a, onPrimary = onA,
            primaryContainer = a.copy(alpha = 0.22f).compositeOver(Color(0xFF121118)),
            onPrimaryContainer = Color.White,
            secondaryContainer = a.copy(alpha = 0.16f).compositeOver(Color(0xFF121118)),
            background = Color(0xFF0F0E14), onBackground = Color(0xFFECEAF2),
            surface = Color(0xFF0F0E14), onSurface = Color(0xFFECEAF2),
            surfaceVariant = Color(0xFF1C1B24), onSurfaceVariant = Color(0xFFA9A6B5),
            surfaceContainer = Color(0xFF18171F),
            surfaceContainerHigh = Color(0xFF1E1D26),
            outline = Color(0xFF3A3846), outlineVariant = Color(0xFF2A2933),
        )
        else -> lightColorScheme(
            primary = a, onPrimary = onA,
            primaryContainer = a.copy(alpha = 0.16f).compositeOver(Color.White),
            onPrimaryContainer = Color(0xFF16151C),
            secondaryContainer = a.copy(alpha = 0.14f).compositeOver(Color.White),
            background = Color(0xFFF7F6FA), onBackground = Color(0xFF16151C),
            surface = Color(0xFFF7F6FA), onSurface = Color(0xFF16151C),
            surfaceVariant = Color(0xFFEDEBF2), onSurfaceVariant = Color(0xFF5E5B6B),
            surfaceContainer = Color(0xFFFFFFFF),
            surfaceContainerHigh = Color(0xFFFFFFFF),
            outline = Color(0xFFCFCCD8), outlineVariant = Color(0xFFE4E2EA),
        )
    }

    val base = Typography()
    val typography = base.copy(
        headlineLarge = base.headlineLarge.copy(fontWeight = FontWeight.SemiBold, letterSpacing = (-0.5).sp),
        headlineMedium = base.headlineMedium.copy(fontWeight = FontWeight.SemiBold, letterSpacing = (-0.3).sp),
        titleLarge = base.titleLarge.copy(fontWeight = FontWeight.SemiBold),
        titleMedium = base.titleMedium.copy(fontWeight = FontWeight.Medium),
        labelLarge = TextStyle(fontSize = 14.sp, fontWeight = FontWeight.Medium),
    )

    MaterialTheme(colorScheme = scheme, typography = typography, content = content)
}

